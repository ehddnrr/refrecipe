<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 냉장고 + 레시피 추천</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#0f111a;
    color:white;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#161925;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:10px;
    margin:5px 0 15px 0;
    background:#1f2335;
    color:white;
    border:1px solid #333;
    border-radius:6px;
}

button{
    background:#6366f1;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    margin-right:5px;
}

button:hover{
    background:#4f46e5;
}

.delete{
    background:#ef4444;
}

#app{display:none;}

li{
    list-style:none;
    padding:10px;
    margin-bottom:10px;
    background:#1f2335;
    border-radius:6px;
}
.warn{color:#f87171;font-weight:bold;}
pre{
    background:#1f2335;
    padding:15px;
    border-radius:8px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div id="login" class="card">
<h2>로그인</h2>
<input id="id" value="demo_user">
<input id="pw" type="password" value="1234">
<button onclick="login()">로그인</button>
</div>

<div id="app">

<div class="card">
<h2>냉장고 등록</h2>

<input id="name" placeholder="재료명">

<select id="cat">
<option>채소</option>
<option>육류</option>
<option>해산물</option>
<option>유제품</option>
<option>기타</option>
</select>

<input id="qty" type="number" value="1">

<label>유통기한</label>
<input id="exp" type="date">

<button onclick="add()">등록</button>
<button onclick="logout()">로그아웃</button>
</div>

<div class="card">
<h2>식재료 리스트</h2>
<ul id="list"></ul>
</div>

<div class="card">
<h2>유통기한 알림</h2>
<div id="alert"></div>
</div>

<div class="card">
<h2>AI 레시피 생성</h2>

<button onclick="recipe()">
레시피 추천 받기
</button>

<pre id="result"></pre>
</div>

</div>

<script type="module">

import { GoogleGenerativeAI }
from "https://esm.run/@google/generative-ai";

const API_KEY = "여기에_GEMINI_API_KEY";

let data =
JSON.parse(localStorage.getItem("fridge")) || [];

window.login=function(){

const id=document.getElementById("id").value;
const pw=document.getElementById("pw").value;

if(id==="demo_user" && pw==="1234"){
document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";
render();
}else{
alert("로그인 실패");
}

}

window.logout=function(){
location.reload();
}

window.add=function(){

const item={
name:document.getElementById("name").value,
cat:document.getElementById("cat").value,
qty:document.getElementById("qty").value,
exp:document.getElementById("exp").value
};

if(!item.name||!item.exp){
alert("입력값 확인");
return;
}

data.push(item);
localStorage.setItem("fridge",JSON.stringify(data));
render();

}

window.del=function(i){
data.splice(i,1);
localStorage.setItem("fridge",JSON.stringify(data));
render();
}

function render(){

const list=document.getElementById("list");
list.innerHTML="";

let warns=[];

data.forEach((v,i)=>{

const d=new Date(v.exp);
const t=new Date();
const diff=Math.ceil((d-t)/(1000*60*60*24));

if(diff<=3) warns.push(v.name);

list.innerHTML+=`
<li>
<b>${v.name}</b> (${v.cat}) / ${v.qty}<br>
유통기한: ${v.exp}
${diff<=3?`<div class="warn">⚠ ${diff}일 남음</div>`:""}
<br><button onclick="del(${i})" class="delete">삭제</button>
</li>
`;

});

document.getElementById("alert").innerText =
warns.length
? "⚠ 임박: " + warns.join(", ")
: "이상 없음";

}

window.recipe = async function(){

const items=data.map(v=>v.name).join(", ");

const prompt=`
냉장고 재료: ${items}

이 재료로 만들 수 있는 요리를
1. 요리명
2. 조리시간
3. 난이도
4. 레시피
5. 칼로리

형태로 알려줘.
`;

document.getElementById("result").innerText="생성중...";

const genAI = new GoogleGenerativeAI(API_KEY);

const model = genAI.getGenerativeModel({
model:"gemini-2.5-flash"
});

const res = await model.generateContent(prompt);

document.getElementById("result").innerText =
res.response.text();

}

</script>

</body>
</html>
