<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 냉장고 관리</title>

<style>
body{
    background:#0f111a;
    color:white;
    font-family:sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#161925;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    background:#1f2335;
    color:white;
    border:1px solid #333;
    box-sizing:border-box;
}

button{
    background:#6366f1;
    color:white;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    border-radius:6px;
    margin-right:5px;
}

button:hover{
    background:#4f46e5;
}

.delete-btn{
    background:#ef4444;
}

.delete-btn:hover{
    background:#dc2626;
}

#app{
    display:none;
}

li{
    margin-bottom:10px;
    padding:10px;
    background:#1f2335;
    border-radius:6px;
    list-style:none;
}

.warning{
    color:#f87171;
    font-weight:bold;
}

pre{
    white-space:pre-wrap;
    background:#1f2335;
    padding:15px;
    border-radius:8px;
}
</style>
</head>

<body>

<div id="loginBox" class="card">
    <h2>식재료 관리 로그인</h2>

    <input id="id" type="text" value="demo_user">

    <input id="pw" type="password" value="1234">

    <button onclick="login()">로그인</button>
</div>

<div id="app">

    <div class="card">
        <h2>냉장고 관리</h2>

        <input id="name" placeholder="재료명">

        <select id="category">
            <option>채소</option>
            <option>육류</option>
            <option>해산물</option>
            <option>유제품</option>
            <option>기타</option>
        </select>

        <input id="qty" type="number" value="1" min="1">

        <label>유통기한</label>
        <input id="expire" type="date">

        <button onclick="addIngredient()">등록</button>
        <button onclick="logout()">로그아웃</button>
    </div>

    <div class="card">
        <h2>유통기한 알림</h2>
        <div id="notification"></div>
    </div>

    <div class="card">
        <h2>식재료 목록</h2>
        <ul id="list"></ul>
    </div>

    <div class="card">
        <h2>AI 레시피 프롬프트 생성</h2>

        <button onclick="generatePrompt()">
            냉장고 기반 레시피 요청
        </button>

        <pre id="promptResult"></pre>
    </div>

</div>

<script>

let ingredients =
JSON.parse(localStorage.getItem("ingredients")) || [];

function login(){

    const id=document.getElementById("id").value;
    const pw=document.getElementById("pw").value;

    if(id==="demo_user" && pw==="1234"){

        document.getElementById("loginBox").style.display="none";
        document.getElementById("app").style.display="block";

        render();

    }else{

        alert("아이디 또는 비밀번호가 틀렸습니다.");

    }
}

function logout(){

    document.getElementById("app").style.display="none";
    document.getElementById("loginBox").style.display="block";

}

function saveData(){

    localStorage.setItem(
        "ingredients",
        JSON.stringify(ingredients)
    );

}

function addIngredient(){

    const name=document.getElementById("name").value;
    const category=document.getElementById("category").value;
    const qty=document.getElementById("qty").value;
    const expire=document.getElementById("expire").value;

    if(!name){

        alert("재료명을 입력하세요.");
        return;

    }

    if(!expire){

        alert("유통기한을 선택하세요.");
        return;

    }

    ingredients.push({
        name,
        category,
        qty,
        expire
    });

    saveData();

    document.getElementById("name").value="";
    document.getElementById("qty").value=1;

    render();

}

function deleteIngredient(index){

    ingredients.splice(index,1);

    saveData();

    render();

}

function render(){

    const list=document.getElementById("list");

    list.innerHTML="";

    let warningItems=[];

    ingredients.forEach((item,index)=>{

        const today=new Date();
        const expireDate=new Date(item.expire);

        const diff=Math.ceil(
            (expireDate-today)/(1000*60*60*24)
        );

        let warning="";

        if(diff<=3){

            warning=`<span class="warning">⚠️ ${diff}일 남음</span>`;

            warningItems.push(item.name);

        }

        const li=document.createElement("li");

        li.innerHTML=`
            <b>${item.name}</b><br>
            카테고리 : ${item.category}<br>
            수량 : ${item.qty}<br>
            유통기한 : ${item.expire}<br>
            ${warning}
            <br><br>
            <button class="delete-btn"
                onclick="deleteIngredient(${index})">
                삭제
            </button>
        `;

        list.appendChild(li);

    });

    const notification=
        document.getElementById("notification");

    if(warningItems.length){

        notification.innerHTML=
            "⚠️ 곧 만료 예정 : " +
            warningItems.join(", ");

    }else{

        notification.innerHTML=
            "만료 임박 식재료가 없습니다.";

    }

}

function generatePrompt(){

    if(ingredients.length===0){

        alert("식재료를 먼저 등록하세요.");
        return;

    }

    const names=
        ingredients.map(i=>i.name).join(", ");

    const prompt=`
냉장고 식재료:

${names}

위 재료를 활용해서

1. 만들 수 있는 요리 3개
2. 조리시간
3. 난이도
4. 레시피
5. 예상 칼로리

를 포함하여 추천해줘.
`;

    document.getElementById("promptResult")
        .textContent=prompt;

}

</script>

</body>
</html>
